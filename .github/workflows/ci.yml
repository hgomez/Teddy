name: Rust CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always

# Jeton GITHUB_TOKEN en lecture seule : aucun job n'a besoin d'en savoir plus
permissions:
  contents: read

jobs:
  # Job 1: build, tests and formatting
  build_and_test:
    name: Build, Test & Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        # rustup is preinstalled on GitHub-hosted runners; no need for a
        # third-party action that would download the toolchain from a mutable source
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

      - name: Lint with Clippy
        run: cargo clippy -- -D warnings

  # Job 2: security audit (independent job for clarity)
  security_audit:
    name: Security Audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Rustsec Audit
        # Ignores live in .cargo/audit.toml (the location read by cargo-audit >= 0.22)
        run: cargo audit

  # Job 3: CI/CD security gate (plumber)
  # Lives in its own workflow (.github/workflows/plumber.yml): it runs the
  # official getplumber/plumber action, gated at 100 points, and publishes
  # the score badge. See docs/DECISIONS.md (D-006).
