name: Rust CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always

# Jeton GITHUB_TOKEN en lecture seule : aucun job n'a besoin d'en savoir plus
permissions:
  contents: read

jobs:
  # Job 1 : Compilation, Tests et Formatage
  build_and_test:
    name: Build, Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        # rustup est préinstallé sur les runners GitHub-hosted ; pas besoin d'une
        # action tierce qui téléchargerait la toolchain depuis une source mutable
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

      - name: Lint with Clippy
        run: cargo clippy -- -D warnings

  # Job 2 : Audit de sécurité (indépendant pour plus de clarté)
  security_audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Rustsec Audit
        # Les ignores sont déclarés dans .cargo/audit.toml (emplacement lu par cargo-audit >= 0.22)
        run: cargo audit
