version: 2
updates:
  - package-ecosystem: "cargo" # Rust-specific
    directory: "/"
    schedule:
      interval: "weekly"     # Weekly is enough to avoid PR spam
    open-pull-requests-limit: 5 # Avoids 50 open PRs at once
    groups:
      rust-dependencies:     # Bundles small updates into a single PR
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "rust"
