# Plumber CI/CD security policy for Teddy.
#
# Overlay on the shipped baseline (extends: plumber:default): only the
# controls that differ from the defaults are listed. `plumber config diff`
# shows the effective deviation, `plumber config resolve` the full config.
extends: plumber:default

github:
  controls:
    # The third-party actions used in this repository's workflows are a
    # deliberate, reviewed list: Swatinem/rust-cache (build cache, below the
    # default 20k-stars floor, SHA-pinned in ci.yml — docs/DECISIONS.md D-005)
    # and getplumber/plumber itself (the security scan, SHA-pinned and
    # checksum- and attestation-verified by the action — docs/DECISIONS.md
    # D-006). The default star-threshold/allowlist profile is therefore
    # tightened to an explicit allowlist of exactly those two actions —
    # anything else outside actions/* fails the gate.
    githubActionMustComeFromAuthorizedSources:
      enabled: true
      trustGithubOfficialActions: true
      trustSameOrgActions: true
      minimumStars: 0
      trustedGithubActions:
        - Swatinem/rust-cache
        - getplumber/plumber

    # The "workflows must include required actions" control is an
    # organisation-level policy (a universal action list does not exist);
    # deliberately left disabled here, see the baseline comments.
    workflowMustIncludeRequiredActions:
      enabled: false
      requiredGroups: []
