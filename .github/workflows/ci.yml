name: Rust CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    # Daily: fail when the plumber pin is no longer the latest release
    - cron: "0 6 * * *"

env:
  CARGO_TERM_COLOR: always

# Jeton GITHUB_TOKEN en lecture seule : aucun job n'a besoin d'en savoir plus
permissions:
  contents: read

jobs:
  # Job 1: build, tests and formatting
  build_and_test:
    name: Build, Test & Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        # rustup is preinstalled on GitHub-hosted runners; no need for a
        # third-party action that would download the toolchain from a mutable source
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

      - name: Lint with Clippy
        run: cargo clippy -- -D warnings

  # Job 2: security audit (independent job for clarity)
  security_audit:
    name: Security Audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Rustsec Audit
        # Ignores live in .cargo/audit.toml (the location read by cargo-audit >= 0.22)
        run: cargo audit

  # Job 3: CI/CD security gate (plumber)
  # The binary is pinned to the latest release: version + official SHA256
  # checksum. Every new plumber release must be reflected here.
  # See docs/DECISIONS.md (D-006).
  plumber:
    name: CI/CD Security Gate (plumber)
    runs-on: ubuntu-24.04
    env:
      PLUMBER_VERSION: v0.6.4
      PLUMBER_SHA256: 92e1cb3a636ca0d1653ba8420053af6008f3af753a9d60739d002013a4cbeaeb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false
      - name: Install plumber (pinned)
        run: |
          curl -fsSL -o /tmp/plumber \
            "https://github.com/getplumber/plumber/releases/download/${PLUMBER_VERSION}/plumber-linux-amd64"
          echo "${PLUMBER_SHA256}  /tmp/plumber" | sha256sum --check --strict
          install -m 0755 /tmp/plumber /usr/local/bin/plumber
          plumber version
      - name: Plumber analyze
        env:
          # Read-only token, scoped by the workflow-level permissions block
          GH_TOKEN: ${{ github.token }}
        run: plumber analyze

  # Job 4: ensure the plumber pin always tracks the latest release.
  # Runs on a daily schedule and fails when a new plumber release is out,
  # forcing the pin bump (see docs/DECISIONS.md, D-006).
  plumber_version_check:
    name: Plumber pin is the latest release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false
      - name: Compare pinned version with the latest plumber release
        run: |
          PINNED_CI="$(grep -oP 'PLUMBER_VERSION: \Kv[0-9.]+' .github/workflows/ci.yml | head -1)"
          PINNED_MISE="$(grep -oP '"github:getplumber/plumber" = "\K[0-9.]+' .mise.toml)"
          LATEST="$(curl -fsSL https://api.github.com/repos/getplumber/plumber/releases/latest | jq -r .tag_name)"
          echo "pinned in ci.yml : ${PINNED_CI}"
          echo "pinned in .mise.toml: v${PINNED_MISE}"
          echo "latest release   : ${LATEST}"
          if [ "${PINNED_CI}" != "v${PINNED_MISE}" ]; then
            echo "::error::Plumber pins are inconsistent: ci.yml has ${PINNED_CI} but .mise.toml has v${PINNED_MISE}. They must be bumped together (see docs/DECISIONS.md, D-006)."
            exit 1
          fi
          if [ "${PINNED_CI}" != "${LATEST}" ]; then
            echo "::error::Plumber pin is outdated: pinned ${PINNED_CI}, latest release ${LATEST}."
            echo "::error::Bump PLUMBER_VERSION + PLUMBER_SHA256 in .github/workflows/ci.yml and the version in .mise.toml, then re-run 'plumber analyze' and fix any new findings."
            exit 1
          fi
          echo "Plumber pin is up to date (${PINNED_CI})."
